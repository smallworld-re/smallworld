name: Release

on:
  release: 
    types: [released]


jobs:
  Deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: pypi
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Build
        run: uv build
      - name: Check ABI Tables
        # The published wheel must carry real ABI tables, never the no-data
        # marker (a build on the wrong Python, or with
        # SMALLWORLD_ABI_ALLOW_MISSING set).
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as zf:
              text = zf.read("smallworld/platforms/abi/_data/__init__.py").decode()
          if "\nAVAILABLE = True\n" not in text:
              raise SystemExit(f"{wheel} has no ABI tables:\n{text}")
          print(f"{wheel}: ABI tables present")
          PY
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
  Docs:
    runs-on: smallworld-arc
    permissions:
      contents: write
    steps:          
      - name: Checkout
        uses: actions/checkout@v6
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
        if: ${{ env.bot_token != '' }}
        with:
          token: ${{ secrets.BOT_TOKEN}}
      - name: Build devshell
        run: |
          nix -L develop -c true
      - name: Build Test Artifacts
        run: |
          nix build ./ci#tests
          tar -C tests -xvf result/test_binaries.tar
          rm -rf result
          nix build ./ci#rtos_demo
          cp result/zephyr.elf use_cases/rtos_demo/zephyr.elf
      - name: Build docs
        run: |
          nix develop -c sphinx-build -W -b html docs build/documentation
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/documentation
          # destination_dir: main
          exclude_assets: .gitignore
