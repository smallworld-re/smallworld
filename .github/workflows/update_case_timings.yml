name: Update Case Timings
on:
  schedule:
    - cron: "00 6 * * MON"
  workflow_dispatch:

# Serialize runs so a scheduled run and a manual dispatch don't open
# competing PRs. Don't cancel an in-flight run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # How many recent successful Pull Request runs to merge. Newer runs win for
  # cases measured more than once. Merging several runs covers cases a single
  # PR branch (cut from an older main) didn't have yet.
  SOURCE_RUNS: "5"

jobs:
  Update-Case-Timings:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Recent Timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Coverage-Combine uploads case-timings.json in the coverage-combined
          # artifact. Only use successful runs: a failed or cancelled shard
          # records truncated durations that would skew the balance.
          mkdir -p timings
          found=0
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow pull-request.yml --status success --limit 30 \
              --json databaseId --jq '.[].databaseId'); do
            dest="timings/$(printf '%03d' "$found")-$run_id"
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
                --name coverage-combined --dir "$dest" 2>/dev/null \
                && [ -s "$dest/case-timings.json" ]; then
              echo "using run $run_id"
              found=$((found + 1))
            else
              rm -rf "$dest"
            fi
            [ "$found" -ge "$SOURCE_RUNS" ] && break
          done
          if [ "$found" -eq 0 ]; then
            echo "No successful Pull Request run with case timings found" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: List Cases On Main
        # The harness manifest is stdlib-only, so this needs no nix devshell.
        run: python3 tests/integration.py --list --format json > case-list.json

      - name: Merge Timings
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          # Source runs come from PR branches, which may add, rename, or drop
          # cases relative to main. Keep only cases main actually defines.
          cases = {case["id"] for case in json.loads(pathlib.Path("case-list.json").read_text())}

          # Directories are numbered newest-first; apply oldest-first so the
          # newest measurement of each case wins.
          merged = {}
          sources = sorted(pathlib.Path("timings").glob("*/case-timings.json"))
          for path in reversed(sources):
              merged.update(json.loads(path.read_text()))
          # Round to cut diff noise; sub-0.1s differences don't affect balance.
          merged = {
              case: round(seconds, 1)
              for case, seconds in merged.items()
              if case in cases
          }

          target = pathlib.Path("tests/case_timings.json")
          old = json.loads(target.read_text()) if target.exists() else {}
          target.write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n")

          added = len(merged.keys() - old.keys())
          removed = len(old.keys() - merged.keys())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(
                  f"Merged {len(sources)} runs: timings for {len(merged)} of "
                  f"{len(cases)} cases on main ({added} added, {removed} removed, "
                  f"{sum(merged.values()) / 3600:.1f}h total)\n"
              )
          PY

      - uses: peter-evans/create-pull-request@v7
        with:
          # PR_TOKEN rather than GITHUB_TOKEN so the PR triggers CI.
          token: ${{ secrets.PR_TOKEN }}
          add-paths: tests/case_timings.json
          branch: chore/update-case-timings
          delete-branch: true
          commit-message: "chore: update integration case timings"
          title: "chore: update integration case timings"
          body: |
            Refreshes `tests/case_timings.json` from the most recent successful
            Pull Request runs so integration shards stay balanced. Cases missing
            from this file are costed at the median duration, so slow new cases
            can pile onto a single shard and stretch the whole run.

            Generated by the `Update Case Timings` workflow.
