[project]
name = "smallworld-re"
version = "3.0.1"
description = "An emulation stack tracking library"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9.6"
license = { file = "LICENSE.txt" }
authors = [
   { name = "MIT Lincoln Laboratory" }, 
   { email = "smallworld@ll.mit.edu" },
]
urls = { Homepage = "https://github.com/smallworld-re/smallworld", Issues = "https://github.com/smallworld-re/smallworld/issues" }
dependencies = [
    "capstone>=5.0.3",
    "jsons>=1.6.3",
    "lief>=0.17.2",
    # Python 3.9 resolves claripy to z3-solver 4.10.2.0, which still imports
    # pkg_resources. setuptools 82 removed pkg_resources from the wheel.
    "setuptools>=80.9.0,<81; python_version < '3.10'",
    "pycparser>=2.18,<3.0",
    "networkx>=3.2.1",
    "claripy>=9.2.102",
    # SLEIGH translator behind the default p-code use/def backend. A plain
    # native wheel with no dependencies of its own -- unlike pyghidra, which
    # needs a JVM and stays in the optional emu-ghidra extra for the Ghidra
    # emulator.
    #
    # Marked for 3.10+ because pypcode is: on 3.9 there is no wheel, the
    # availability probe in instructions.py finds no module, and use/def
    # falls back to Capstone with one log line -- the same degradation a
    # platform without a ghidra_language_id already gets.
    #
    # Upper bound tracks angr, which pins pypcode<4.0; without it, installing
    # the emu-angr extra alongside would be unresolvable.
    "pypcode>=3.2,<4.0; python_version >= '3.10'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Developer tooling only -- nothing here is needed to *use* SmallWorld, which
# still supports Python 3.9 (`requires-python` above).
#
# Every entry carries a `python_version >= '3.12'` marker because the tooling
# is only ever run on the project's pinned interpreter (`.python-version` and
# the nix flake are both 3.12). Without the marker uv also has to lock this
# group for 3.9-3.11, where the newest installable black, notebook,
# jupyter-server, anyio, urllib3, requests, pip, bleach, tornado, filelock and
# soupsieve are all releases with known security advisories whose fixes need a
# newer Python. On an older interpreter `uv sync` still works; it just
# installs the library without these tools.
[dependency-groups]
dev = [
    "black>=23.11.0; python_version >= '3.12'",
    "black[jupyter]>=25.11.0; python_version >= '3.12'",
    "flake8>=6.1.0; python_version >= '3.12'",
    "isort>=5.13.2; python_version >= '3.12'",
    "jupyterlab>=4.4.9; python_version >= '3.12'",
    "mypy>=1.7.1; python_version >= '3.12'",
    "notebook>=7.4.7; python_version >= '3.12'",
    "pip-tools>=7.3.0; python_version >= '3.12'",
    "pre-commit>=3.5.0; python_version >= '3.12'",
    "sphinx>=7.1.2; python_version >= '3.12'",
    "sphinxcontrib-programoutput>=0.17; python_version >= '3.12'",
    "timeout-decorator>=0.5.0; python_version >= '3.12'",
]

[project.optional-dependencies]
emu-angr = [
    "angr>=9.2.102; python_version >= '3.10'",
    # Not used by SmallWorld directly. angr's pyvex depends on bitstring with
    # no upper bound, but bitstring 5.0 removed `ConstBitStream`, which pyvex
    # (as of 9.2.194) still uses - so `import angr` fails on 5.x. Drop this
    # once pyvex supports bitstring 5.
    "bitstring<5; python_version >= '3.10'",
]
emu-ghidra = [
    "pyghidra>=3.0",
    "claripy>=9.2.102",
]
emu-panda = [
    "pandare2",
]
emu-unicorn = [
    "unicorn>=2.1.3",
]
emu-styx = [
    "styx-emulator>=0.1.0",
    "styxafl>=0.1.0",
]
emu-triton = [
    # JonathanSalwan's Triton. The PyPI distribution is named "triton-library"
    # but imports as "triton"; do NOT confuse it with OpenAI's "triton". The
    # newest PyPI release is a pre-release (1.0.0rc4), so the floor names it
    # explicitly, otherwise a plain ">=1.0.0" would exclude every published
    # wheel.
    "triton-library>=1.0.0rc4",
]
emu-all = [
    "smallworld-re[emu-angr,emu-ghidra,emu-panda,emu-unicorn,emu-styx,emu-triton]",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["smallworld*"]

[tool.mypy]
disable_error_code = ["annotation-unchecked"]
exclude = '^(build|ci|docs|examples|nix/unicornafl-build|nix/styx-emulator-build|nix/styxafl-build|nix/styxafl-src|nix/triton-build|smallworld_re\.egg-info|tests|use_cases|\.mypy_cache)/'

[tool.uv]
exclude-dependencies = [
    "pandare2",
    "styx-emulator",
    "styxafl",
    "triton-library",
]
